apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: liferay-basic
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/Dhruvlunagaria/liferay-argocd.git
    targetRevision: HEAD
    path: .
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
